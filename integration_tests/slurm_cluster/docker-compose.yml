services:
  slurm-main:
    build:
      context: .
      dockerfile: Dockerfile
    image: slurm-mini-cluster:latest
    container_name: slurm-main
    hostname: slurm-main
    environment:
      NODE_ROLE: controller
    volumes:
      - shared:/shared
    networks:
      - slurm-net

  slurm-worker1:
    image: slurm-mini-cluster:latest
    container_name: slurm-worker1
    hostname: slurm-worker1
    environment:
      NODE_ROLE: worker
    depends_on:
      - slurm-main
    volumes:
      - shared:/shared
    networks:
      - slurm-net

  slurm-worker2:
    image: slurm-mini-cluster:latest
    container_name: slurm-worker2
    hostname: slurm-worker2
    environment:
      NODE_ROLE: worker
    depends_on:
      - slurm-main
    volumes:
      - shared:/shared
    networks:
      - slurm-net

volumes:
  shared: {}

networks:
  slurm-net:
    driver: bridge
