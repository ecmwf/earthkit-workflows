[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=80", "setuptools_scm[toml]>=6.2", "packaging>=25"]

[dependency-groups]
dev = ["pytest", "pytest-xdist>=3.8", "prek", "ty==0.0.2", "build", "bokeh"]

[project]
authors = [
  {name = "European Centre for Medium-Range Weather Forecasts (ECMWF)", email = "software.support@ecmwf.int"}
]
dependencies = [
  "earthkit-data",
  "cloudpickle",
  "numpy",
  "xarray",
  "networkx",
  "array-api-compat",
  "sortedcontainers",
  "pyvis",
  "dill",
  "pyrsistent",
  "pydantic",
  "pyzmq",
  "fire",
  "orjson",
  "qubed>=0.3.0"
]
description = "Earthkit Workflows is a Python library for declaring earthkit task DAGs, as well as scheduling and executing them on heterogeneous computing systems."
# version provided via setuptools_scm module, which derives it from git tag
dynamic = ["version"]
license = "Apache-2.0"
license-files = ["LICENSE"]
name = "earthkit-workflows"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
addopts = "-n8"
log_cli = true
log_cli_level = "DEBUG"
testpaths = ["tests/"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
  "D1",  # pydocstyle: Missing Docstrings
  "D107",  # pydocstyle: numpy convention
  "D203",
  "D205",
  "D212",
  "D213",
  "D401",
  "D402",
  "D413",
  "D415",
  "D416",
  "D417",
  "E722",
  "E731",
  "E741"
]
select = [
  "F",  # pyflakes
  "E",  # pycodestyle
  "W",  # pycodestyle warnings
  "I",  # isort
  "D"  # pydocstyle
]

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
include = ["earthkit.workflows*", "cascade*"]
where = ["src"]

[tool.setuptools_scm]
local_scheme = "no-local-version"
write_to = "src/earthkit/workflows/_version.py"
write_to_template = '''# Do not change! Do not track in version control!
__version__ = "{version}"
'''
